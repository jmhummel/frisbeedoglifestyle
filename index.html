<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frisbee Dog Lifestyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #EDE1C9;
    --foam: #F7F4EC;
    --indigo: #1F3F5C;
    --wave-blue: #3B6EA5;
    --dog-tan: #D9A868;
    --frisbee-blue: #2757C4;
    --ink: #1A1A1A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--parchment);
    font-family: 'DM Sans', sans-serif;
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* ---------- background wave, slow ambient pan ---------- */
  .wave-wrap {
    position: absolute;
    inset: -8%;
    overflow: hidden;
  }

  .wave-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 116%;
    height: 116%;
    object-fit: cover;
    animation: waveDrift 46s ease-in-out infinite alternate;
    filter: saturate(0.92) brightness(1.02);
  }

  @keyframes waveDrift {
    0%   { transform: translate(0%, 0%) scale(1); }
    50%  { transform: translate(-2.2%, -1.1%) scale(1.02); }
    100% { transform: translate(1.4%, 1.6%) scale(1); }
  }

  /* soft cream vignette so foreground content stays legible over the woodblock print */
  .vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% 50%, transparent 40%, rgba(237,225,201,0.55) 100%),
      linear-gradient(to bottom, rgba(237,225,201,0.55) 0%, rgba(237,225,201,0.05) 22%, rgba(237,225,201,0.05) 70%, rgba(237,225,201,0.6) 100%);
    pointer-events: none;
  }

  /* ---------- content stack: title / dog / wordmark, grouped with tight consistent spacing ---------- */
  .content-stack {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(2px, 1.4vh, 16px);
    padding: 16px;
  }

  /* ---------- wordmark text (original XCF layers: black fill + white stroke) ---------- */
  .text-top {
    width: clamp(240px, 30vw, 560px);
    z-index: 3;
    animation: fadeDown 1s ease-out both;
    animation-delay: 0.15s;
    filter: drop-shadow(0 4px 10px rgba(31,63,92,0.16));
  }

  .text-top img {
    width: 100%;
    height: auto;
    display: block;
  }

  .text-bottom {
    width: clamp(160px, 20vw, 380px);
    z-index: 3;
    animation: fadeUp 1s ease-out both;
    animation-delay: 0.3s;
    filter: drop-shadow(0 4px 10px rgba(31,63,92,0.16));
  }

  .text-bottom img {
    width: 100%;
    height: auto;
    display: block;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- dog + frisbee hero ---------- */
  .hero-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .hero {
    width: clamp(280px, 46vw, 620px);
    filter: drop-shadow(0 22px 34px rgba(31,63,92,0.28));
    animation:
      throwIn 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both,
      idleFloat 5.5s ease-in-out infinite;
    animation-delay: 0s, 1.1s;
    transform-origin: 60% 55%;
  }

  @keyframes throwIn {
    0%   { opacity: 0; transform: translate(38vw, -22vh) rotate(-38deg) scale(0.7); }
    65%  { opacity: 1; transform: translate(-2%, 1%) rotate(4deg) scale(1.04); }
    100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
  }

  @keyframes idleFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-14px) rotate(-1.6deg); }
  }

  .hero-click {
    cursor: pointer;
    transition: transform 0.2s ease;
    border-radius: 20%;
  }

  .hero-click:hover {
    transform: scale(1.035);
  }

  .hero-click:focus-visible {
    outline: 3px solid var(--frisbee-blue);
    outline-offset: 10px;
  }

  .hero-click.spin {
    animation: backflipSpin 0.75s cubic-bezier(0.3, 0.1, 0.3, 1) 1;
  }

  @keyframes backflipSpin {
    0%   { transform: translateY(0) rotate(0deg) scaleY(1); }
    12%  { transform: translateY(6px) rotate(0deg) scaleY(0.86); }
    45%  { transform: translateY(-76px) rotate(190deg) scaleY(1.02); }
    75%  { transform: translateY(-16px) rotate(330deg) scaleY(1); }
    90%  { transform: translateY(4px) rotate(358deg) scaleY(0.9); }
    100% { transform: translateY(0) rotate(360deg) scaleY(1); }
  }

  .hero img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ---------- instagram link-out ---------- */
  .ig-button {
    position: absolute;
    left: 50%;
    bottom: clamp(20px, 5vh, 44px);
    transform: translateX(-50%);
    z-index: 4;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    border-radius: 999px;
    background: rgba(247, 244, 236, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(31, 63, 92, 0.18);
    box-shadow: 0 8px 24px rgba(31, 63, 92, 0.16);
    color: var(--indigo);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.01em;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    animation: fadeUp2 0.9s ease-out both;
    animation-delay: 0.5s;
  }

  .ig-button:hover {
    transform: translateX(-50%) translateY(-3px);
    box-shadow: 0 12px 28px rgba(31, 63, 92, 0.24);
    background: rgba(247, 244, 236, 0.92);
  }

  .ig-button:focus-visible {
    outline: 3px solid var(--frisbee-blue);
    outline-offset: 3px;
  }

  .ig-button svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp2 {
    from { opacity: 0; transform: translate(-50%, 16px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  @media (max-width: 560px) {
    .hero { width: clamp(240px, 62vw, 420px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .wave-img { animation: none; }
    .hero { animation: none; opacity: 1; transform: none; }
    .text-top, .text-bottom { animation: none; opacity: 1; transform: none; }
    .ig-button { animation: none; opacity: 1; transform: translate(-50%, 0); }
    .hero-click.spin { animation: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="wave-wrap">
    <img class="wave-img" src="assets/wave-bg.jpg" alt="">
  </div>
  <div class="vignette"></div>

  <div class="content-stack">
  <div class="text-top">
    <img src="assets/text-top.png" alt="Frisbee Dog">
  </div>

  <div class="hero-wrap">
    <div class="hero">
      <div class="hero-click" id="dogClick" tabindex="0" role="button" aria-label="Click to make the dog do a backflip">
      <img src="assets/dog.png" alt="Frisbee Dog logo — a cartoon dog catching a blue frisbee">
      </div>
    </div>
  </div>

  <div class="text-bottom">
    <img src="assets/text-bottom.png" alt="Lifestyle">
  </div>
  </div>

  <a class="ig-button" href="https://www.instagram.com/jmhummel_" target="_blank" rel="noopener noreferrer" aria-label="Follow on Instagram, @jmhummel_">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="2" y="2" width="20" height="20" rx="6" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="4.6" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="17.3" cy="6.7" r="1.15" fill="currentColor"/>
    </svg>
    <span>@jmhummel_</span>
  </a>
</div>

<script>
  (function () {
    var dog = document.getElementById('dogClick');
    if (!dog) return;
    var spinning = false;

    function doSpin() {
      if (spinning) return;
      spinning = true;
      dog.classList.add('spin');
    }

    dog.addEventListener('click', doSpin);
    dog.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        doSpin();
      }
    });
    dog.addEventListener('animationend', function (e) {
      if (e.animationName === 'backflipSpin') {
        dog.classList.remove('spin');
        spinning = false;
      }
    });
  })();
</script>

</body>
</html>
